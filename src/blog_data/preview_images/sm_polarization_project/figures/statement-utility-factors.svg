    <text x="38.0" y="460.0" font-size="11" fill="#596273" text-anchor="start" font-weight="400">Tightness is mean pairwise cosine similarity between a group&#x27;s arguments; u / u* is the realized share of the ideal utility.</text>
    <text x="38.0" y="476.0" font-size="11" fill="#596273" text-anchor="start" font-weight="400">The top two factors are not independent: they correlate at +0.76, because each round removes the tightest remaining cluster. Bars are therefore</text>
    <text x="38.0" y="492.0" font-size="11" fill="#596273" text-anchor="start" font-weight="400">single-factor fits, not a decomposition. The left panel separates them, splitting each round at its own median tightness.</text>
